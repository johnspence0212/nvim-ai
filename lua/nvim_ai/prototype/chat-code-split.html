<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>PROTOTYPE — Code split</title>
  <!--
    Three 50/50 Code+Chat frames after nc, switchable via ?variant=.
    Chat half is the locked Chat-only A (full-bleed stack).
    A: Code left | Chat right. B: Code above / Chat below. C: Chat left | Code right.
    Focus starts in Code. Throwaway. No ACP.
  -->
  <style>
    :root {
      --bg: #1a1b26;
      --fg: #c0caf5;
      --muted: #565f89;
      --you: #7aa2f7;
      --pending: #e0af68;
      --border: #3b4261;
      --stroke: 2px solid #7aa2f7;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #0f0f14; color: var(--fg); font-family: ui-monospace, "IBM Plex Mono", "JetBrains Mono", Menlo, monospace; }
    body { display: flex; flex-direction: column; }
    .frame { flex: 1; display: flex; flex-direction: column; min-height: 0; margin: 12px 12px 64px; background: #0b0c12; }
    .topbar {
      flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between;
      gap: 16px; background: #3d59a1; color: #fff; padding: 3px 12px; font-size: 11px; min-height: 26px;
    }
    .topbar-cmds { display: flex; flex-wrap: wrap; gap: 4px 8px; }
    .topbar-info { color: #c0caf5; white-space: nowrap; }
    .topbar kbd { font: inherit; opacity: 0.85; }
    .workspace { flex: 1; display: flex; min-height: 0; padding: 8px; gap: 8px; }
    .panel {
      border-radius: 0; overflow: hidden; background: #1a1b26; border: var(--stroke);
      display: flex; flex-direction: column; min-height: 0; min-width: 0;
    }
    .winbar { color: var(--muted); font-size: 11px; padding: 4px 8px; border-bottom: 1px solid var(--border); }
    .winbar strong { color: var(--fg); font-weight: 600; }
    .footbar { color: var(--muted); font-size: 11px; padding: 4px 8px; border-top: 1px solid var(--border); }
    .code-body { flex: 1; display: flex; min-height: 0; }
    .gutter { width: 2.6em; color: var(--muted); text-align: right; padding: 8px 6px 8px 0; line-height: 1.45; user-select: none; }
    .code { flex: 1; padding: 8px 10px; line-height: 1.45; white-space: pre; overflow: auto; }
    .code:focus { outline: 1px solid var(--you); outline-offset: -1px; }
    .statusline { color: var(--muted); font-size: 11px; padding: 2px 8px; background: #24283b; }
    .chat { display: flex; flex-direction: column; min-height: 0; min-width: 0; gap: 8px; }
    .transcript-panel { flex: 1; }
    .composer-panel { flex: 0 0 auto; }
    .transcript { flex: 1; overflow: auto; padding: 12px 16px; min-height: 0; }
    .composer-input {
      margin: 0; width: 100%; border: 0; outline: none; resize: none;
      background: #16161e; color: var(--fg); font: inherit; padding: 10px 12px; min-height: 4.5em;
    }
    .turn { margin: 0 0 12px; }
    .you { display: flex; align-items: flex-start; gap: 10px; }
    .rail { flex: 0 0 4px; width: 4px; min-height: 1.4em; align-self: stretch; background: var(--you); }
    .you-tag { color: var(--you); font-size: 11px; letter-spacing: 0.06em; margin-bottom: 2px; }
    .agent { line-height: 1.5; }
    .thinking { color: var(--muted); font-style: italic; font-size: 12px; padding: 6px 0; }
    .queued { display: flex; align-items: flex-start; gap: 10px; }
    .queued .rail { background: var(--pending); }
    .queued-tag { color: var(--pending); font-size: 11px; letter-spacing: 0.06em; }
    .variant-banner {
      position: sticky; top: 0; z-index: 2; font: 600 11px ui-monospace, monospace;
      padding: 6px 8px; margin: -12px -16px 12px; letter-spacing: 0.02em;
    }
    .state-dump {
      position: fixed; bottom: 64px; left: 12px; width: 280px; max-height: 36%;
      background: #0b0c12; border: 1px dashed var(--pending); color: var(--pending);
      font-size: 11px; padding: 8px; overflow: auto; white-space: pre; z-index: 5;
    }
    .switcher {
      position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
      display: flex; align-items: center; gap: 10px; background: #f6f6f0; color: #111;
      border-radius: 999px; padding: 8px 14px; box-shadow: 0 8px 24px #0008; z-index: 10;
      font: 13px ui-sans-serif, system-ui, sans-serif;
    }
    .switcher button { border: 0; background: #111; color: #f6f6f0; width: 28px; height: 28px; border-radius: 50%; cursor: pointer; font-size: 16px; }
    .switcher .label { min-width: 420px; text-align: center; font-weight: 600; }

    /* A — vertical 50/50. Code left, Chat right. */
    .var-a .workspace { flex-direction: row; }
    .var-a .code-panel, .var-a .chat { flex: 1 1 50%; }
    .var-a .variant-banner { background: #16161e; color: var(--you); border-bottom: 2px solid var(--you); }

    /* B — horizontal 50/50. Code above, Chat below. */
    .var-b .workspace { flex-direction: column; }
    .var-b .code-panel, .var-b .chat { flex: 1 1 50%; }
    .var-b .variant-banner { background: #3d59a1; color: #fff; }

    /* C — vertical 50/50. Chat left (home side), Code right. */
    .var-c .workspace { flex-direction: row; }
    .var-c .code-panel, .var-c .chat { flex: 1 1 50%; }
    .var-c .variant-banner { background: #16161e; color: var(--pending); border-bottom: 2px solid var(--pending); }
  </style>
</head>
<body>
  <pre class="state-dump" id="stateDump"></pre>
  <div class="frame">
    <div class="topbar">
      <div class="topbar-cmds">
        <span><kbd>&lt;leader&gt;nn</kbd> reserved</span>
        <span><kbd>&lt;leader&gt;nc</kbd> Code</span>
        <span><kbd>&lt;leader&gt;nx</kbd> Chat-only</span>
        <span><kbd>&lt;leader&gt;nq</kbd> cancel</span>
        <span><kbd>&lt;leader&gt;nk</kbd> cheatsheet</span>
      </div>
      <div class="topbar-info">Session · idle · Code open</div>
    </div>
    <div class="workspace" id="workspace"></div>
  </div>
  <div class="switcher">
    <button type="button" id="prev" aria-label="previous variant">←</button>
    <div class="label" id="switchLabel"></div>
    <button type="button" id="next" aria-label="next variant">→</button>
  </div>
  <script>
    const VARIANTS = {
      A: "Code left | Chat right · vertical 50/50",
      B: "Code above / Chat below · horizontal 50/50",
      C: "Chat left | Code right · Chat stays home-side",
    };
    const KEYS = Object.keys(VARIANTS);
    const params = new URLSearchParams(location.search);
    let variant = (params.get("variant") || "A").toUpperCase();
    if (!VARIANTS[variant]) variant = "A";

    const banners = {
      A: "A · 50/50 · Code | Chat",
      B: "B · 50/50 · Code above Chat",
      C: "C · 50/50 · Chat | Code",
    };

    const CODE = `-- waiting file after nc
local M = {}

function M.hello()
  print("Hello, world!")
end

return M`;

    function chatHtml() {
      return `
        <div class="chat">
          <div class="panel transcript-panel">
            <div class="winbar"><strong>Chat</strong> · locked A stack</div>
            <div class="transcript">
              <div class="variant-banner">${banners[variant]}</div>
              <div class="turn"><div class="you"><div class="rail"></div><div><div class="you-tag">YOU</div>hello world in C?</div></div></div>
              <div class="turn"><div class="agent">Here's a minimal C hello world.</div></div>
              <div class="turn"><div class="thinking">thinking...</div></div>
              <div class="turn"><div class="queued"><div class="rail"></div><div><div class="queued-tag">QUEUED</div>Makefile</div></div></div>
            </div>
          </div>
          <div class="panel composer-panel">
            <div class="winbar"><strong>Composer</strong></div>
            <textarea class="composer-input" placeholder="Not focused — Code is."></textarea>
            <div class="footbar">Enter send · Shift-Enter newline</div>
          </div>
        </div>`;
    }

    function codeHtml() {
      const lines = CODE.split("\n");
      const gutter = lines.map((_, i) => i + 1).join("<br>");
      return `
        <div class="panel code-panel">
          <div class="winbar"><strong>Code</strong> · focused</div>
          <div class="code-body">
            <div class="gutter">${gutter}</div>
            <pre class="code" id="code" tabindex="0">${CODE.replace(/</g, "&lt;")}</pre>
          </div>
          <div class="statusline">NORMAL  lua/nvim_ai/init.lua</div>
        </div>`;
    }

    function render() {
      document.body.className = "var-" + variant.toLowerCase();
      document.getElementById("switchLabel").textContent = variant + " (" + VARIANTS[variant] + ")";
      const chat = chatHtml();
      const code = codeHtml();
      document.getElementById("workspace").innerHTML =
        variant === "C" ? chat + code : code + chat;
      const el = document.getElementById("code");
      if (el) el.focus();
      document.getElementById("stateDump").textContent =
        "PROTOTYPE STATE\n" + JSON.stringify({
          variant,
          layout: VARIANTS[variant],
          code: "open",
          focus: "code",
          split: "50/50",
        }, null, 2);
    }

    function setVariant(next) {
      variant = next;
      const url = new URL(location.href);
      url.searchParams.set("variant", variant);
      history.replaceState(null, "", url);
      render();
    }
    function cycle(dir) {
      const i = KEYS.indexOf(variant);
      setVariant(KEYS[(i + dir + KEYS.length) % KEYS.length]);
    }
    document.getElementById("prev").onclick = () => cycle(-1);
    document.getElementById("next").onclick = () => cycle(1);
    document.addEventListener("keydown", (e) => {
      const tag = e.target.tagName;
      if (tag === "INPUT" || tag === "TEXTAREA" || e.target.isContentEditable) return;
      if (e.key === "ArrowLeft") cycle(-1);
      if (e.key === "ArrowRight") cycle(1);
    });
    render();
  </script>
</body>
</html>
